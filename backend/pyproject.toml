[project]
name = "backend"
version = "0.1.0"
description = "Private RAG for financial analysis"
readme = "README.md"
requires-python = ">=3.13.7"
dependencies = [
    "docling>=2.70.0",
    "fastapi>=0.128.0",
    "flashrank>=0.2.10",
    "langchain>=1.2.1",
    "langchain-google-genai>=4.2.0",
    "langchain-ollama>=1.0.1",
    "langchain-text-splitters>=1.1.0",
    "langgraph>=1.0.7",
    "numpy>=2.4.1",
    "pypdfium2>=5.3.0",
    "python-multipart>=0.0.21",
    "supabase>=2.27.2",
    "tiktoken>=0.12.0",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "mlflow>=3.0.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.2.1",
    "ruff>=0.14.14",
]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)s %(name)s: %(message)s"

pythonpath = [
  "."
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["finvault*"]

